<VirtualHost *:80>
    ServerName askpool.thomas-hub.com
    Alias /.well-known/acme-challenge/ /var/www/askpool-acme/.well-known/acme-challenge/
    <Directory /var/www/askpool-acme/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://askpool.thomas-hub.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
<VirtualHost *:443>
    ServerName askpool.thomas-hub.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/askpool.thomas-hub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/askpool.thomas-hub.com/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8092/
    ProxyPassReverse / http://127.0.0.1:8092/
    ErrorLog ${APACHE_LOG_DIR}/askpool-error.log
    CustomLog ${APACHE_LOG_DIR}/askpool-access.log combined
</VirtualHost>
